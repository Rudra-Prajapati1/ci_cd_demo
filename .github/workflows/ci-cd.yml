name: CI / CD Pipeline

on:
  push:
    branches:
      - dev
      - "feature/**"
  pull_request:
    branches:
      - main
      - dev
  workflow_dispatch:
    inputs:
      reason:
        description: "Why are you triggering this manually?"
        required: false
        default: "manual check"
  schedule:
    - cron: "25 10 * * *"    # 3:55 PM IST daily

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

env:
  APP_NAME: "ci-cd-demo"
  MIN_COVERAGE: "80"

jobs:
  test-311:
    name: Test Python 3.11
    uses: ./.github/workflows/reusable-test.yml
    with:
      python-version: "3.11"

  test-312:
    name: Test Python 3.12
    uses: ./.github/workflows/reusable-test.yml
    with:
      python-version: "3.12"

  auto-merge:
    name: Auto-Merge dev → main
    runs-on: ubuntu-latest
    needs: [test-311, test-312]
    if: github.ref == 'refs/heads/dev' && github.event_name == 'push'
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git identity
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Merge dev into main
        run: |
          git checkout main
          git merge --no-ff dev -m "chore: auto-merge dev → main after CI passed [skip ci]"
          git push origin main

  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [test-311, test-312]
    if: github.ref == 'refs/heads/dev' && github.event_name == 'push'
    environment: staging
    steps:
      - name: Simulate staging deploy
        run: |
          echo "🚀 Deploying to staging..."
          echo "App     : ${{ env.APP_NAME }}"
          echo "Branch  : ${{ github.ref_name }}"
          echo "Commit  : ${{ github.sha }}"
          echo "✅ Staging deploy complete"

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: deploy-staging
    if: github.ref == 'refs/heads/dev' && github.event_name == 'push'
    environment: production
    steps:
      - name: Simulate production deploy
        run: |
          echo "🚀 Deploying to production..."
          echo "App     : ${{ env.APP_NAME }}"
          echo "Branch  : ${{ github.ref_name }}"
          echo "Commit  : ${{ github.sha }}"
          echo "✅ Production deploy complete"