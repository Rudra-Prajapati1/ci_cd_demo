name: CI / CD Pipeline

on:
  push:
    branches:
      - dev
      - "feature/**"
  pull_request:
    branches:
      - main
      - dev

jobs:
  # ─────────────────────────────────────────────
  # JOB 1: Run the test suite
  # ─────────────────────────────────────────────
  test:
    name: Run Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run lint check
        run: |
          pip install flake8
          flake8 src/ --max-line-length=100

      - name: Run tests with coverage
        run: pytest

      - name: Upload coverage report
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: .coverage

  # ─────────────────────────────────────────────
  # JOB 2: Auto-merge dev → main (only on push to dev)
  # ─────────────────────────────────────────────
  auto-merge:
    name: Auto-Merge dev → main
    runs-on: ubuntu-latest
    needs: test # only runs if ALL test jobs pass
    if: github.ref == 'refs/heads/dev' && github.event_name == 'push'

    permissions:
      contents: write # needed to push / merge

    steps:
      - name: Checkout repository (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # need full history for merge
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git identity
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Merge dev into main
        run: |
          git checkout main
          git merge --no-ff dev -m "chore: auto-merge dev → main after CI passed [skip ci]"
          git push origin main

      - name: Post merge summary
        run: |
          echo "✅ dev successfully merged into main"
          echo "Triggered by commit: ${{ github.sha }}"
          echo "Merged at: $(date -u)"
