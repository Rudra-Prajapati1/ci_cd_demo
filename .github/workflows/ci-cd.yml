name: CI / CD Pipeline

on:
  push:
    branches:
      - dev
      - "feature/**"
  pull_request:
    branches:
      - main
      - dev
  workflow_dispatch:
    inputs:
      reason:
        description: "Why are you triggering this manually?"
        required: false
        default: "manual check"
  schedule:
    - cron: "25 10 * * *"    # 3:55 PM IST daily

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

env:
  APP_NAME: "ci-cd-demo"
  MIN_COVERAGE: "80"

jobs:
  # ─────────────────────────────────────────────
  # JOB 1 & 2: Run tests on Python 3.11 and 3.12
  # ─────────────────────────────────────────────
  test-311:
    name: Test Python 3.11
    uses: ./.github/workflows/reusable-test.yml
    with:
      python-version: "3.11"

  test-312:
    name: Test Python 3.12
    uses: ./.github/workflows/reusable-test.yml
    with:
      python-version: "3.12"

  # ─────────────────────────────────────────────
  # JOB 3: Build and push Docker image
  # ─────────────────────────────────────────────
  docker-build-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    needs: [test-311, test-312]
    if: github.ref == 'refs/heads/dev' && github.event_name == 'push'
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Login to Docker Hub
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772  # v3.4.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83  # v6.18.0
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/ci-cd-demo:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/ci-cd-demo:${{ github.sha }}

  # ─────────────────────────────────────────────
  # JOB 4: Deploy to staging (after image is built)
  # ─────────────────────────────────────────────
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: docker-build-push
    if: github.ref == 'refs/heads/dev' && github.event_name == 'push'
    environment: staging
    steps:
      - name: Deploy to staging
        run: |
          echo "🚀 Deploying to staging..."
          echo "App    : ${{ env.APP_NAME }}"
          echo "Image  : ${{ secrets.DOCKERHUB_USERNAME }}/ci-cd-demo:${{ github.sha }}"
          echo "Branch : ${{ github.ref_name }}"
          echo "✅ Staging deploy complete"

  # ─────────────────────────────────────────────
  # JOB 5: Deploy to production (requires approval)
  # ─────────────────────────────────────────────
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: deploy-staging
    if: github.ref == 'refs/heads/dev' && github.event_name == 'push'
    environment: production
    steps:
      - name: Deploy to production
        run: |
          echo "🚀 Deploying to production..."
          echo "App    : ${{ env.APP_NAME }}"
          echo "Image  : ${{ secrets.DOCKERHUB_USERNAME }}/ci-cd-demo:${{ github.sha }}"
          echo "Branch : ${{ github.ref_name }}"
          echo "✅ Production deploy complete"

  # ─────────────────────────────────────────────
  # JOB 6: Auto-merge dev → main
  # ─────────────────────────────────────────────
  auto-merge:
    name: Auto-Merge dev → main
    runs-on: ubuntu-latest
    needs: [test-311, test-312]
    if: github.ref == 'refs/heads/dev' && github.event_name == 'push'
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git identity
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Merge dev into main
        run: |
          git checkout main
          git merge --no-ff dev -m "chore: auto-merge dev → main after CI passed [skip ci]"
          git push origin main