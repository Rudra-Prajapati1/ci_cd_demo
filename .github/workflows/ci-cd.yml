name: CI / CD Pipeline

on:
  push:
    branches-ignore:
      - main                   # tests run on all branches except main
  pull_request:
    branches-ignore:
      - main                   # tests run on all PRs except to main
  workflow_dispatch:
    inputs:
      reason:
        description: "Why are you triggering this manually?"
        required: false
        default: "manual check"
  schedule:
    - cron: "25 10 * * *"      # 3:55 PM IST daily — runs on main to catch regressions

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

env:
  APP_NAME: "ci-cd-demo"
  MIN_COVERAGE: "80"

jobs:
  # ─────────────────────────────────────────────
  # JOB 1 & 2: Run tests on Python 3.11 and 3.12
  # Runs on: all branches (except main) + main on schedule
  # ─────────────────────────────────────────────
  test-311:
    name: Test Python 3.11
    uses: ./.github/workflows/reusable-test.yml
    with:
      python-version: "3.11"

  test-312:
    name: Test Python 3.12
    uses: ./.github/workflows/reusable-test.yml
    with:
      python-version: "3.12"

  pr-comment:
    name: PR Comment
    runs-on: ubuntu-latest
    needs: [test-311, test-312]
    if: github.event_name == 'pull_request'
    permissions:
      pull-requests: write
    steps:
      - name: Comment on PR
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea  # v7.0.1
        with:
          script: |
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            // delete previous bot comment if exists
            for (const comment of comments) {
              if (comment.user.type === 'Bot' && comment.body.includes('CI Pipeline Results')) {
                await github.rest.issues.deleteComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: comment.id,
                });
              }
            }

            // post new comment
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `## 🔍 CI Pipeline Results
              
            | Check | Status |
            |-------|--------|
            | Test Python 3.11 | ✅ Passed |
            | Test Python 3.12 | ✅ Passed |
            | Lint (flake8) | ✅ Passed |
            | Coverage | ✅ ≥ 80% |

            **Branch:** \`${{ github.head_ref }}\`
            **Commit:** \`${{ github.sha }}\`
            **Triggered by:** ${{ github.actor }}
            **Run:** [View Details](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})`
            });

  # ─────────────────────────────────────────────
  # JOB 3: Build and push Docker image
  # Runs on: push to dev only, after tests pass
  # ─────────────────────────────────────────────
  docker-build-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    needs: [test-311, test-312]
    if: github.ref == 'refs/heads/dev' && github.event_name == 'push'
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Login to Docker Hub
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772  # v3.4.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83  # v6.18.0
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/ci-cd-demo:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/ci-cd-demo:${{ github.sha }}

  # ─────────────────────────────────────────────
  # JOB 4: Deploy to staging
  # Runs on: push to dev only, after docker image is built
  # ─────────────────────────────────────────────
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: docker-build-push
    if: github.ref == 'refs/heads/dev' && github.event_name == 'push'
    environment: staging
    steps:
      - name: Deploy to staging
        run: |
          echo "🚀 Deploying to staging..."
          echo "App    : ${{ env.APP_NAME }}"
          echo "Image  : ${{ secrets.DOCKERHUB_USERNAME }}/ci-cd-demo:${{ github.sha }}"
          echo "Branch : ${{ github.ref_name }}"
          echo "✅ Staging deploy complete"

  # ─────────────────────────────────────────────
  # JOB 5: Auto-merge dev → main
  # Runs ONLY after staging deploy succeeds
  # This ensures broken docker/deploy never merges to main
  # ─────────────────────────────────────────────
  auto-merge:
    name: Auto-Merge dev → main
    runs-on: ubuntu-latest
    needs: deploy-staging        # ← waits for staging, not just tests
    if: github.ref == 'refs/heads/dev' && github.event_name == 'push'
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git identity
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Merge dev into main
        run: |
          git checkout main
          git merge --no-ff dev -m "chore: auto-merge dev → main after CI passed [skip ci]"
          git push origin main

  # ─────────────────────────────────────────────
  # JOB 6: Deploy to production
  # Runs ONLY after merge to main, requires approval
  # ─────────────────────────────────────────────
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: auto-merge            # ← only after code is in main
    if: github.ref == 'refs/heads/dev' && github.event_name == 'push'
    environment: production      # ← approval gate ⏸️
    steps:
      - name: Deploy to production
        run: |
          echo "🚀 Deploying to production..."
          echo "App    : ${{ env.APP_NAME }}"
          echo "Image  : ${{ secrets.DOCKERHUB_USERNAME }}/ci-cd-demo:${{ github.sha }}"
          echo "Branch : ${{ github.ref_name }}"
          echo "✅ Production deploy complete"

  rollback-production:
    name: Rollback Production
    runs-on: ubuntu-latest
    needs: deploy-production
    if: failure() && github.ref == 'refs/heads/dev' && github.event_name == 'push'
    environment: production
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Get last successful image tag
        id: last-tag
        run: |
          LAST_TAG=$(git log --merges --format="%H" origin/main | head -1)
          echo "tag=${LAST_TAG}" >> $GITHUB_OUTPUT
          echo "Last successful commit: ${LAST_TAG}"

      - name: Login to Docker Hub
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772  # v3.4.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Rollback to last successful image
        run: |
          echo "⏪ Rolling back production..."
          echo "Deploying image: ${{ secrets.DOCKERHUB_USERNAME }}/ci-cd-demo:${{ steps.last-tag.outputs.tag }}"
          echo "✅ Rollback complete"